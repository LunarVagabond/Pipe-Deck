name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # Matches build.yml: 22.04's apt libpipewire-0.3-dev (0.3.48) predates
    # the pinned pipewire/libspa v0.10 crates' minimum (see src-tauri/Cargo.toml,
    # issue #148); 24.04 ships 1.0.5.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libpipewire-0.3-modules

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: npm run format:check
        run: npm run format:check

      - name: npm run lint
        run: npm run lint

      - name: make check
        run: make check

      - name: make test
        run: make test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: make test-e2e
        run: make test-e2e

  windows-check:
    runs-on: windows-latest
    # Cold-cache Windows target checks need more time than the Linux job's 30 minutes.
    timeout-minutes: 40
    # issue #358 stays non-blocking until Windows Prep lands and the tree compiles clean for the msvc target.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check --target x86_64-pc-windows-msvc
        run: cargo check --target x86_64-pc-windows-msvc
        working-directory: src-tauri
