name: PR Format Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title follows convention
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(\[#[0-9]+\]|\[noissue\]|\[hotfix\]|\[security\]) - .+$'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "PR title does not match the required format:"
            echo "  $TITLE"
            echo
            echo "Expected: '[#<issue>] - <short description>', '[noissue] - <short description>', '[hotfix] - <short description>', or '[security] - <short description>'."
            echo "See .github/CONTRIBUTING.md -> Pull Request Titles."
            exit 1
          fi

  commit-hint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Hint at commit message convention (non-blocking)
        run: |
          set -uo pipefail
          # Merges are squash-only, so individual commits never land on main —
          # only the PR title does. This is a courtesy hint, not a gate: it
          # never fails the check, just flags commits that don't match so a
          # contributor can tidy them up if they want to.
          pattern='^(\[#[0-9]+\]|\[noissue\]|\[hotfix\]|\[security\]) - .+$'
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          found=0
          while IFS= read -r line; do
            sha="${line%% *}"
            msg="${line#* }"
            if ! [[ "$msg" =~ $pattern ]]; then
              echo "Commit $sha doesn't match the usual convention (not required, just a hint):"
              echo "  $msg"
              found=1
            fi
          done < <(git log --no-merges --format='%h %s' "$base..$head")

          if [ "$found" -ne 0 ]; then
            echo
            echo "Suggested format: '[#<issue>] - <short description>', '[noissue] - <short description>', '[hotfix] - <short description>', or '[security] - <short description>'."
            echo "This is squashed on merge, so only the PR title matters for main's history — see .github/CONTRIBUTING.md -> Commit Messages."
          fi
          exit 0
